[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.0"
fdeflate = "0.3.7"
font8x8 = "0.3"
image = "0.25.9"
noise = "0.9.0"
rand = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "float_roundtrip"] }
toml = "1.1.8"
mapgen = { path = "crates/mapgen" }

# Most test time goes into generating worlds, over ten times slower
# unoptimized: build the dependencies optimized (once) and the workspace
# crates at opt-level 1, which keeps incremental rebuilds short. Debug
# assertions and overflow checks stay on. See README, Development tasks.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
