[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Internal crates by path; external dependencies are added by the pull
# requests that use them. The direction of the edges is checked by
# tools/guardrails (see CLAUDE.md, Architecture).
[workspace.dependencies]
science = { path = "crates/science" }
timeline = { path = "crates/timeline" }
system = { path = "crates/system" }
world = { path = "crates/world" }
catalogue = { path = "crates/catalogue" }
adapters = { path = "crates/adapters" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The lists live in clippy.toml (and the relaxed copies in adapters, cli
# and tools): random sources outside the seed hierarchy, wall clocks,
# default-hashed maps, files, network and processes.
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

# Dependencies are built optimized once; the workspace crates stay at the
# default level for short incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3
