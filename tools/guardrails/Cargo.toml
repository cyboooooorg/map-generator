[package]
name = "guardrails"
description = "Architecture checks of the workspace (dependency direction, science constants, README length, clippy configs) and the test-tier budget gate"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
quick-xml = "0.42.0"
syn = { version = "2", features = ["full", "visit"] }
toml = "1.2.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
