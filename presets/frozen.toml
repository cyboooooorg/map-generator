# Ice world: perpetually frozen. Oceans are sealed under ice and temperate
# zones become permafrost plains.
name = "frozen"
description = "Ice world: perpetually frozen"

[locales.fr]
name = "Glacée"
description = "Monde de glace : gelé pour toujours"

[star]                                 # host star and orbit (see `mapgen::star`)
# Drawn like the stars nearby, beyond the outer edge of the habitable zone: the cold comes from the distance.
position = [1.0, 1.35]

[climate]
moisture = 0.15
volcanic = -0.30

[defaults]
pressure = [0.3, 1.0]                 # surface pressure in bar, drawn in this range
surface_age = [0.5, 2.0]               # Ga: age of the oldest surviving surface

# Thin, clean air: a pale sky, sparse water clouds.
[atmosphere]
rayleigh = [0.17, 0.41, 1.0]
haze = 0.05
clouds = "water"
cloud_cover = -0.3

# Plates keep moving under the ice, as during Earth's snowball eras.
[geology]
regime = "plates"

# target = [biomes replaced by it]; unlisted biomes stay as they are
# (Tundra, IceCap, Taiga, Snow, Mountain).
[remap]
# Rivers stay rivers: they only flow (and are only drawn) where it thaws.
FrozenOcean = ["DeepOcean", "Ocean", "SeaIce", "MagmaSea"]
FrozenLake = ["Lake"]
IceCap = ["Beach", "Wetland"]
GlacialPlain = [
  "Plain", "Shrubland", "Savanna", "Desert",
  "LavaField", "AshLand", "ScorchedWaste",
]
Taiga = ["Forest", "Jungle"]
