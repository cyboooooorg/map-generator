# Dead rock: no liquid water, all life extinct; only rock and dust remain.
name = "barren"
description = "Dead rock: arid and lifeless, no water"

[climate]
moisture = -0.65
volcanic = -0.40

# target = [biomes replaced by it]; unlisted biomes stay as they are
# (Mountain, Volcano).
[remap]
# Dry sea basins and old shores are rock; dry lake beds are dust flats;
# without snow, high peaks are bare mountain.
RockyWaste = [
  "DeepOcean", "Ocean", "SeaIce", "River", "CausticLake", "FrozenOcean",
  "AcidSea", "DeepAcidSea", "AcidRiver", "AcidShore",
  "Beach", "Wetland", "ToxicSwamp",
  "LavaField", "AshLand", "ScorchedWaste",
]
DustPlain = [
  "Plain", "Shrubland", "Savanna", "Desert", "Tundra", "IceCap", "GlacialPlain",
  "AcidFlatland", "Forest", "Jungle", "Taiga", "Lake", "FrozenLake",
]
Mountain = ["Snow"]
