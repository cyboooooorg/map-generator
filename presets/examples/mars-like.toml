# Example custom preset: a small, cold desert world with polar ice and dry
# basins where its oceans used to be.
#   mise run gen -- --planet presets/examples/mars-like.toml
name = "mars-like"
description = "Small cold desert world with polar caps"

# A fixed value, or a [min, max] range drawn at random. Command-line options
# still win over these.
#
# The sea level stays in the usual range even though no water is left: the
# oceans are remapped to dust below, and biome elevations are measured from
# the sea level, so a very low one would put every pixel above the snow line.
[defaults]
pressure = 0.006
sea_level = [0.10, 0.30]
circumference = 21300
axial_tilt = 25.2
volcanic = [0.0, 0.3]

[climate]
temperature = -3.6
moisture = -0.7

# Any BiomeRules field; the others keep their default. Ice only near the
# poles (down to about 65 degrees): too dry for snow on lower mountains.
[rules]
polar = -13.5
sea_ice_temperature = -13.5
highland_snow_temperature = -13.5
snow_line = 0.6

# Thin CO2 laden with fine dust: a butterscotch sky (with blue sunsets),
# dust clouds and storms.
[atmosphere]
rayleigh = [0.17, 0.41, 1.0]
haze = 0.4
haze_colour = [0.85, 0.6, 0.4]
clouds = "dust"

# target = [biomes replaced by it]
[remap]
DustPlain = [
  "Ocean", "DeepOcean", "Lake", "FrozenLake", "River", "Beach", "Wetland",
  "Plain", "Shrubland", "Savanna", "Desert", "Forest", "Jungle", "Taiga", "Tundra",
]
IceCap = ["SeaIce"]
RockyWaste = ["Mountain"]
