# Example custom preset: a small, cold desert world with polar ice and dry
# basins where its oceans used to be.
#   mise run gen -- --planet presets/examples/mars-like.toml
name = "mars-like"
description = "Small cold desert world with polar caps"

[locales.fr]
name = "Type Mars"
description = "Petit désert froid aux calottes polaires"

[star]                                 # host star and orbit (see `mapgen::star`)
type = "G2V"                           # the Sun
orbit_au = 1.524
eccentricity = 0.0934                    # like Mars
metallicity = 0.0                      # the Sun's

# A fixed value, or a [min, max] range drawn at random. Command-line options
# still win over these.
#
# The sea level stays in the usual range even though no water is left: the
# oceans are remapped to dust below, and biome elevations are measured from
# the sea level, so a very low one would put every pixel above the snow line.
[defaults]
pressure = 0.006
surface_age = 4.0                      # Ga: age of the oldest surviving surface
sea_level = [0.10, 0.30]
circumference = 21300
axial_tilt = 25.2
volcanic = [0.0, 0.3]
# No liquid water today (0.006 bar), but rivers carved its valleys once.
erosion = 1.0

[climate]
temperature = -10.0                # °C: with its distance (×0.81 in kelvin), about −50 °C on average
moisture = -0.7

# Any BiomeRules field; the others keep their default. Ice only near the
# poles (down to about 65 degrees): too dry for snow on lower mountains.
# `polar` and `highland_snow_temperature` are summer temperatures.
[rules]
polar = -62.0
sea_ice_temperature = -70.0
highland_snow_temperature = -62.0
snow_line = 0.6

# Thin CO2 laden with fine dust: a butterscotch sky (with blue sunsets),
# dust clouds and storms.
[atmosphere]
rayleigh = [0.17, 0.41, 1.0]
haze = 0.4
haze_colour = [0.85, 0.6, 0.4]
clouds = "dust"

# A single lid since its youth; its water was lost about 3.5 Ga ago.
[geology]
regime = "stagnant"
wet_until = 3.5                        # Ga: end of the era of liquid water
maria = [3.7, 3.0]                     # Ga: the volcanic plains of the Hesperian
# Mars against the Moon (Hartmann, "Isochrons for Martian crater populations",
# PSI; Hartmann 2005, doi:10.1016/j.icarus.2004.11.023): 2.6 times the
# asteroids per unit area, each digging a crater 0.751 times as wide
# (slower impacts, stronger gravity).
impact_ratio = 2.6
crater_scale = 0.751

# target = [biomes replaced by it]
[remap]
DustPlain = [
  "Ocean", "DeepOcean", "Lake", "FrozenLake", "River", "Beach", "Wetland",
  "Plain", "Shrubland", "Savanna", "Desert", "Forest", "Jungle", "Taiga", "Tundra",
]
IceCap = ["SeaIce"]
RockyWaste = ["Mountain"]
