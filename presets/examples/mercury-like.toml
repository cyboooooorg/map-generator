# Example custom preset: a small, airless world of grey rock, with dark
# smooth plains in its old basins.
#   mise run gen -- --planet presets/examples/mercury-like.toml
name = "mercury-like"
description = "Small airless grey world, cratered highlands and dark plains"

[locales.fr]
name = "Type Mercure"
description = "Petit monde gris sans atmosphère, hauts plateaux cratérisés et plaines sombres"

[star]                                 # host star and orbit (see `mapgen::star`)
type = "G2V"                           # the Sun
orbit_au = 0.387
eccentricity = 0.2056                    # like Mercury
metallicity = 0.0                      # the Sun's
resonance = "3:2"                      # Mercury's observed spin-orbit state, whatever the seed

# A fixed value, or a [min, max] range drawn at random. Command-line options
# still win over these. No water ever flowed: no erosion. The sea level only
# sets how much of the surface the smooth basins cover.
[defaults]
pressure = 0.0
surface_age = 4.0                      # Ga: age of the oldest surviving surface
sea_level = [0.10, 0.30]
circumference = 15329
axial_tilt = 0.0
volcanic = 0.0
erosion = 0.0

[climate]
temperature = -20.0                # °C: with its distance, about 170 °C on average, like Mercury
moisture = -0.9
volcanic = -0.4

# No atmosphere: no sky, no clouds.
[atmosphere]
haze = 0.0
clouds = "none"

# A single lid, never wet: wet_until at or above the surface age.
[geology]
regime = "stagnant"
wet_until = 4.6                        # Ga: end of the era of liquid water
maria = [4.0, 3.6]                     # Ga: its smooth plains, as inside Caloris

# target = [biomes replaced by it]
[remap]
# Old lava-flooded basins: dark smooth plains.
AshLand = [
  "DeepOcean", "Ocean", "SeaIce", "Lake", "FrozenLake", "River", "Beach", "Wetland",
]
# Cratered highlands: grey rock, no ice outside shadowed craters.
RockyWaste = [
  "Plain", "Shrubland", "Savanna", "Desert", "Forest", "Jungle", "Taiga", "Tundra",
  "IceCap", "LavaField", "Volcano",
]
Mountain = ["Snow"]
