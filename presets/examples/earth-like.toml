# Example custom preset: the terran planet type with Earth's own size, tilt
# and share of land (29 % of the surface), instead of random values.
#   mise run gen -- --planet presets/examples/earth-like.toml
name = "earth-like"
description = "Earth's size, tilt and land share, full biome spectrum"

# A fixed value, or a [min, max] range drawn at random. Command-line options
# still win over these.
[defaults]
pressure = 1.0
# The sea level is computed for each seed to leave this share of land.
land_fraction = 0.29
circumference = 40075
axial_tilt = 23.44
volcanic = [0.1, 0.3]
