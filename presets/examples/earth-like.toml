# Example custom preset: the terran planet type with Earth's own size, tilt
# and share of land (29 % of the surface), instead of random values.
#   mise run gen -- --planet presets/examples/earth-like.toml
name = "earth-like"
description = "Earth's size, tilt and land share, full biome spectrum"

[locales.fr]
name = "Type Terre"
description = "Taille, inclinaison et part des terres de la Terre, tous les biomes"

[star]                                 # host star and orbit (see `mapgen::star`)
type = "G2V"                           # the Sun
orbit_au = 1.0
eccentricity = 0.0167                    # like Earth

# A fixed value, or a [min, max] range drawn at random. Command-line options
# still win over these.
[defaults]
pressure = 1.0
surface_age = 0.4                      # Ga: age of the oldest surviving surface
# The sea level is computed for each seed to leave this share of land.
land_fraction = 0.29
circumference = 40075
axial_tilt = 23.44
volcanic = [0.1, 0.3]

# Plates recycle the sea floor and erosion wears the land: few craters.
[geology]
regime = "plates"
