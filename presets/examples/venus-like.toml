# Example custom preset: an Earth-sized furnace under a thick atmosphere,
# with vast volcanic plains, a few highland continents and lava channels.
#   mise run gen -- --planet presets/examples/venus-like.toml
name = "venus-like"
description = "Earth-sized furnace: volcanic plains, highland continents, lava"

[locales.fr]
name = "Type Vénus"
description = "Fournaise de la taille de la Terre : plaines volcaniques, continents de hauts plateaux, lave"

[star]                                 # host star and orbit (see `mapgen::star`)
type = "G2V"                           # the Sun
orbit_au = 0.723

# A fixed value, or a [min, max] range drawn at random. Command-line options
# still win over these. Venus spins backwards with a tilt of 177.4 degrees,
# the same seasons as 2.6 degrees. No liquid water: no erosion. The sea level
# only sets how much of the surface the lowland plains cover (about 70 %).
[defaults]
pressure = 92.0
surface_age = 0.5                      # Ga: age of the oldest surviving surface
sea_level = [0.25, 0.35]
circumference = 38025
axial_tilt = 2.6
volcanic = [0.5, 0.9]
erosion = 0.0

# The dense atmosphere spreads its heat to the poles (see [atmosphere]).
[climate]
moisture = -0.9
volcanic = 0.5

# 92 bar of CO2 under a total deck of sulfuric acid clouds: a yellow-white
# sky, and a surface hidden from space.
[atmosphere]
rayleigh = [0.6, 0.5, 0.3]           # sky colour of the gas and its absorbers
haze = 1.0
haze_colour = [1.0, 0.88, 0.6]
greenhouse = 450.0                 # °C: about 460 °C at the surface, like Venus
clouds = "sulfuric"
cloud_cover = 1.0

# Resurfaced globally 300–750 Ma ago (crater counts), cratered since.
[geology]
regime = "episodic"

# target = [biomes replaced by it]; unlisted biomes stay as they are
# (Mountain, LavaField, AshLand, Volcano).
[remap]
# Lowland basalt plains where an ocean would be.
ScorchedWaste = ["DeepOcean", "Ocean", "SeaIce", "Lake", "FrozenLake"]
# Long lava channels follow the old river courses.
LavaField = ["River"]
AshLand = ["Beach", "Wetland", "Forest", "Jungle", "Taiga"]
# Highland plateaus and their folded terrain.
RockyWaste = [
  "Plain", "Shrubland", "Savanna", "Desert", "IceCap", "Tundra", "GlacialPlain",
]
Mountain = ["Snow"]
