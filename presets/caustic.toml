# Acid world: mildly warm, saturated with caustic moisture. Oceans become
# acid seas and vegetation zones drown in toxic runoff.
name = "caustic"
description = "Acid world: corrosive atmosphere, toxic wetlands"

[locales.fr]
name = "Caustique"
description = "Monde acide : atmosphère corrosive, marais toxiques"

[climate]
temperature = 4.5
moisture = 0.55

[defaults]
pressure = [2.0, 5.0]                 # surface pressure in bar, drawn in this range
surface_age = [0.3, 0.8]               # Ga: age of the oldest surviving surface

# A dense, corrosive haze tints the sky yellow-green; acid clouds.
[atmosphere]
rayleigh = [0.4, 0.55, 0.25]           # sky colour of the gas and its absorbers
haze = 0.3
haze_colour = [0.85, 0.95, 0.45]
clouds = "sulfuric"

# Like Venus: the lid overturns now and then, wiping out the craters.
[geology]
regime = "episodic"

# target = [biomes replaced by it]; unlisted biomes stay as they are
# (Mountain, LavaField, AshLand, Volcano).
[remap]
DeepAcidSea = ["DeepOcean"]
AcidSea = ["Ocean", "SeaIce"]
CausticLake = ["Lake"]
AcidRiver = ["River"]
AcidShore = ["Beach"]
ToxicSwamp = ["Wetland", "Forest", "Jungle", "Taiga"]
AcidFlatland = [
  "Plain", "Shrubland", "Savanna", "Tundra", "Desert",
  "IceCap", "Snow", "GlacialPlain",
]
