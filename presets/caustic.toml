# Acid world: mildly warm, saturated with caustic moisture. Oceans become
# acid seas and vegetation zones drown in toxic runoff.
name = "caustic"
description = "Acid world: corrosive atmosphere, toxic wetlands"

[climate]
temperature = 0.10
moisture = 0.55

# target = [biomes replaced by it]; unlisted biomes stay as they are
# (Mountain, LavaField, AshLand, Volcano).
[remap]
CausticLake = ["DeepOcean", "Ocean", "SeaIce", "Lake", "River"]
ToxicSwamp = ["Beach", "Wetland", "Forest", "Jungle", "Taiga"]
AcidFlatland = [
  "Plain", "Shrubland", "Savanna", "Tundra", "Desert",
  "IceCap", "Snow", "GlacialPlain",
]
