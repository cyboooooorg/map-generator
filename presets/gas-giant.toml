# A cold gas giant like Jupiter or Saturn: no surface, cloud bands of
# ammonia ice (cream zones, ochre belts), storms and, often, rings.
name = "gas-giant"
description = "Gas giant like Jupiter or Saturn: cloud bands, storms, rings"

[locales.fr]
name = "Géante gazeuse"
description = "Comme Jupiter ou Saturne : bandes nuageuses, tempêtes, anneaux"

[star]                                 # host star and orbit (see `mapgen::star`)
# Beyond the ice line, where giants form (about 4 to 15 AU around the Sun).
position = [2.6, 4.6]

[giant]                                # see `mapgen::giant_world`
kind = "gas"
mass = [30.0, 1500.0]                  # Earth masses: Saturn 95, Jupiter 318
rings = [0.25, 0.5]                    # odds of bright rings, of faint ones

[defaults]
pressure = 0.3                         # bar: a thin sky above the cloud tops, so the bands show
surface_age = 0.0                      # no ground: no craters

# A deep, hazy atmosphere.
[atmosphere]
rayleigh = [0.55, 0.5, 0.42]             # the gas scatters little blue: the bands keep their colours
haze = 0.15
haze_colour = [0.92, 0.86, 0.74]
clouds = "none"                        # the bands are the clouds
