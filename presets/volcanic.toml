# Fire world: scorching, bone-dry and heavily volcanic. Ocean basins fill
# with magma and lowlands are scoured to bare rock.
name = "volcanic"
description = "Fire world: extreme heat, near-zero moisture"

[locales.fr]
name = "Volcanique"
description = "Monde de feu : chaleur extrême, humidité presque nulle"

[climate]
moisture = -0.55
volcanic = 0.50

[defaults]
pressure = [5.0, 20.0]                 # surface pressure in bar, drawn in this range

# Dense air thick with volcanic aerosols: an orange sky, patchy sulfuric
# clouds.
[atmosphere]
rayleigh = [0.5, 0.35, 0.25]           # sky colour of the gas and its absorbers
haze = 0.45
haze_colour = [1.0, 0.55, 0.25]
greenhouse = 20.0                  # °C
clouds = "sulfuric"
cloud_cover = -0.2

# target = [biomes replaced by it]; unlisted biomes stay as they are
# (Mountain, LavaField, AshLand, Volcano).
[remap]
MagmaSea = ["DeepOcean", "Ocean", "SeaIce", "Lake"]
LavaField = ["River"]
AshLand = ["Beach", "Wetland", "Forest", "Jungle", "Taiga"]
ScorchedWaste = [
  "Plain", "Shrubland", "Savanna", "Desert",
  "IceCap", "Tundra", "Snow", "GlacialPlain",
]
