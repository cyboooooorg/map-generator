name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Every job runs a mise task, so `mise run ci` locally runs what this
# pipeline runs (the front-end apart, see mise.toml). Path filters skip the
# jobs a change cannot affect; `ci-ok` always reports, so it is the one
# check to require. Pushes to main keep main's caches warm for branches.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/clippy.toml'
              - '.config/**'
              - 'mise.toml'
              - 'README.md'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'mise.toml'
              - '.github/workflows/**'
            markdown:
              - '**/*.md'
              - '**/.markdownlint*'
              - 'mise.toml'
              - '.github/workflows/**'

  fmt-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys on Cargo.lock and the members' manifests, not the
          # root one: a profile change there must not restore a stale target/.
          key: ${{ hashFiles('Cargo.toml') }}
          # Only main saves: branches read main's cache, so their own entries
          # would only evict it from the 10 GB the repository is allowed.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run fmt:check
      - run: mise run lint
      - run: mise run ci:actions

  tier1:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds before the timed run, so the budget measures the tests only.
      - run: cargo nextest run --profile tier1 --workspace --no-run
      - run: mise run test:tier1 -- --test-threads num-cpus

  tier2:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --profile tier2 --workspace --no-run
      - run: mise run test:tier2 -- --test-threads num-cpus

  markdown:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run md:lint

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run web:check
      - run: mise run web:build

  # The one check to require: green when every other job passed or was
  # skipped by the path filters, red when one failed or was cancelled.
  ci-ok:
    if: always()
    needs: [changes, fmt-lint, tier1, tier2, markdown, web]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
