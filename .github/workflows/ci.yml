name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Generated TypeScript types are committed
        # `cargo test` regenerates web/src/lib/api/types from the Rust API types.
        run: git diff --exit-code -- web/src/lib/api/types
      - name: Front-end checks
        run: mise run web:check
      - name: Front-end build
        run: mise run web:build
