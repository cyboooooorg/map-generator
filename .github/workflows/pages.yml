name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run in progress is never cancelled, so a
# deployment is not cut half way.
concurrency:
  group: pages
  cancel-in-progress: false

# Publishes the science book (docs/science). Figures are committed, so the
# build needs no cargo; the `docs` job of ci.yml checks them.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/configure-pages@v6
      - run: mise run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
