# A steam world: a deep supercritical steam envelope hides the surface; seen
# from space it is a fully clouded world in shades of grey, as if it were
# only clouds (issue #492). It has an ice giant's dynamics at the model's
# radius.

[giant]                                # see `mapgen::giant_world`
kind = "steam"
rings = [0.0, 0.0]                     # no rings

[atmosphere]
rayleigh = [1.0, 1.0, 1.0]             # neutral: no hue
haze = 0.12
haze_colour = [0.8, 0.8, 0.8]
clouds = "none"                        # the bands are the clouds
