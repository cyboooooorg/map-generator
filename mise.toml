# Toolchain and tasks for map-generator.
# Run `mise install` once, then `mise tasks` to list the available tasks.

[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }
# Matches the Docker image (Dockerfile)
node = "26"

[tasks.build]
description = "Build the optimized binary"
run = "cargo build --release"

[tasks.gen]
description = "Generate a planet and its system into systems/ (pass options after --, e.g. mise run gen -- --planet frozen)"
depends = ["build"]
run = "target/release/map-generator"

[tasks.hex]
description = "Resample a generated world onto a hex grid (e.g. mise run hex -- systems/mgs-36196-42/bodies/d/sizes/2048x1024 --columns 96)"
depends = ["build"]
run = "target/release/hexgrid"

[tasks.test]
description = "Run the test suite"
run = "cargo test --workspace --all-features"

[tasks."test:invariance"]
description = "Check that a planet keeps its large-scale geography at 1024 and 2048 pixels wide (slow, release build)"
run = "cargo test --release -p mapgen --all-features --test resolution_invariance -- --ignored"

[tasks.lint]
description = "Check formatting and run clippy with warnings denied"
run = [
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.clean-systems]
description = "Delete every generated system under systems/ (asks first); restart the server after it so its index drops them"
confirm = "Delete every system under ./systems (names and pins included)?"
run = "find ./systems -mindepth 1 -not -name '.gitignore' -delete"

# ---------------------------------------------------------------------------------------------------- #
# Web app (web/ front-end, crates/server back-end)
# ---------------------------------------------------------------------------------------------------- #
[tasks."web:install"]
description = "Install the front-end dependencies (skipped when package-lock.json has not changed)"
dir = "web"
run = "npm ci"
sources = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]

[tasks."web:check"]
description = "Type-check the front-end (strict, warnings fail) and run its unit tests"
depends = ["web:install"]
dir = "web"
run = ["npm run check", "npm test"]

[tasks."web:build"]
description = "Build the front-end into web/dist/"
depends = ["web:install"]
dir = "web"
run = "npm run build"

[tasks."server:dev"]
description = "Run the web server on http://localhost:3000 (systems/ and presets/ of this checkout)"
run = "cargo run -p mapgen-server"

[tasks.dev]
description = "Run the server and the Vite dev server together: http://localhost:5173 (Ctrl+C stops both)"
depends = ["web:install"]
run = """
#!/usr/bin/env bash
set -euo pipefail
cargo build -p mapgen-server
target/debug/mapgen-server &
server=$!
trap 'kill $server 2>/dev/null' EXIT
cd web && npm run dev
"""

# ---------------------------------------------------------------------------------------------------- #
# Docker (behind the machine-wide Traefik, http://planets.localhost)
# `up` is a file task in mise-tasks/
# ---------------------------------------------------------------------------------------------------- #
[tasks.down]
description = "Stops the planet viewer container"
run = "docker compose down --remove-orphans"

[tasks.logs]
description = "Follows the planet viewer container logs"
run = "docker compose logs -f planets"
