# Toolchain and tasks for map-generator.
# Run `mise install` once, then `mise tasks` to list the available tasks.

[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }

[tasks.build]
description = "Build the optimized binary"
run = "cargo build --release"

[tasks.gen]
description = "Generate a world (pass options after --, e.g. mise run gen -- --planet frozen)"
depends = ["build"]
run = "target/release/map-generator"

[tasks.hex]
description = "Resample a generated world onto a hex grid (e.g. mise run hex -- worlds/terran-42 --columns 96)"
depends = ["build"]
run = "target/release/hexgrid"

[tasks.test]
description = "Run the test suite"
run = "cargo test --workspace --all-features"

[tasks.lint]
description = "Check formatting and run clippy with warnings denied"
run = [
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.clean-worlds]
description = "Delete every generated world under worlds/"
run = "find ./worlds -mindepth 1 -not -name '.gitignore' -delete"
