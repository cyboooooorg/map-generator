# Toolchain and tasks for map-generator.
# Run `mise install` once, then `mise tasks` to list the available tasks.
# `mise run ci` runs what the GitHub pipeline runs for Rust and Markdown.

[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }
cargo-nextest = "0.9.152"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# The front-end (web/, paused during the engine phase of the rewrite)
node = "26"

[tasks.ci]
description = "Run every check of the pipeline but the front-end: format, clippy, tier 1 and 2 tests with their budgets, markdownlint"
depends = ["fmt:check", "lint", "test:tier1", "test:tier2", "md:lint"]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy with warnings denied (determinism and boundary lints included)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run tier 1 and tier 2 tests with their budgets"
depends = ["test:tier1", "test:tier2"]

[tasks."test:tier1"]
description = "Tier 1 (unit tests and guardrails), budget 2 min (pass nextest options after --)"
run = [
  "cargo nextest run --profile tier1 --workspace {{arg(name='nextest_args', var=true, default='')}}",
  "cargo run -q -p guardrails -- budget target/nextest/tier1/junit.xml 120 'tier 1'",
]

[tasks."test:tier2"]
description = "Tier 2 (regression crate, shared reference systems), budget 8 min (pass nextest options after --)"
run = [
  "cargo nextest run --profile tier2 --workspace {{arg(name='nextest_args', var=true, default='')}}",
  "cargo run -q -p guardrails -- budget target/nextest/tier2/junit.xml 480 'tier 2'",
]

[tasks."test:heavy"]
description = "Tier 3 (heavy: 15 km worlds, oracle, censuses), release build, no budget; paste its output in a pull request that changes what the engines produce"
run = "cargo nextest run --profile heavy --release --workspace --run-ignored only --no-tests pass"

[tasks."md:lint"]
description = "Lint the Markdown written for the rewrite (globs in .markdownlint-cli2.jsonc)"
run = "markdownlint-cli2"

[tasks."ci:actions"]
description = "Lint the GitHub workflows"
run = "actionlint"

# ---------------------------------------------------------------------------------------------------- #
# Front-end (web/): kept untouched during the engine phase; its checks keep running in CI.
# Not part of `ci`: `npm ci` must not run in a worktree on the shared machine.
# ---------------------------------------------------------------------------------------------------- #
[tasks."web:install"]
description = "Install the front-end dependencies (skipped when package-lock.json has not changed)"
dir = "web"
run = "npm ci"
sources = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]

[tasks."web:check"]
description = "Type-check the front-end (strict, warnings fail) and run its unit tests"
depends = ["web:install"]
dir = "web"
run = ["npm run check", "npm test"]

[tasks."web:build"]
description = "Build the front-end into web/dist/"
depends = ["web:install"]
dir = "web"
run = "npm run build"
