# Toolchain and tasks for map-generator.
# Run `mise install` once, then `mise tasks` to list the available tasks.
# `mise run ci` runs what the GitHub pipeline runs for Rust and Markdown.

[tools]
rust = { version = "1.99", components = "clippy,rustfmt" }
cargo-nextest = "0.9.152"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# The science book (docs/science). mdBook 0.5 changed the preprocessor
# protocol: mdbook-katex 0.10 and mdbook-mermaid 0.17 are built on it.
# mdbook-katex publishes no binary for 0.10.0 itself: the pinned release
# holds the 0.10.0-alpha binaries, built against mdbook-preprocessor 0.5.1
# (each build warns about the version mismatch, harmlessly). It has no
# linux-aarch64 asset, so the book builds on x86-64 Linux and macOS only.
"github:rust-lang/mdBook" = "0.5.4"
"github:lzanini/mdbook-katex" = "0.10.0-alpha-binaries"
"github:badboy/mdbook-mermaid" = "0.17.1"
lychee = "0.24.2"
# The front-end (web/, paused during the engine phase of the rewrite)
node = "26"

# The test tasks eval their command: mise hands usage_* values shell-quoted.
# The steps run one after the other: two test tiers at once would take
# eight threads on the shared machine and skew the budgets.
[tasks.ci]
description = "Run every check of the pipeline but the front-end: format, clippy, workflows, tier 1 and 2 tests with their budgets, markdownlint"
run = [
  "mise run fmt:check",
  "mise run lint",
  "mise run ci:actions",
  "mise run test:tier1",
  "mise run test:tier2",
  "mise run md:lint",
  "mise run docs:check",
]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy with warnings denied (determinism and boundary lints included)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run tier 1 and tier 2 tests with their budgets"
run = ["mise run test:tier1", "mise run test:tier2"]

[tasks."test:tier1"]
description = "Tier 1 (unit tests, doctests and guardrails), budget 2 min (pass nextest options after --)"
usage = 'arg "[nextest_args]..." var=#true'
run = [
  "eval cargo nextest run --profile tier1 --workspace ${usage_nextest_args:-}",
  "cargo run -q -p guardrails -- budget target/nextest/tier1/junit.xml 120 'tier 1'",
  # nextest does not run doctests; outside the budget gate, they are few.
  "cargo test --doc --workspace -q",
]

[tasks."test:tier2"]
description = "Tier 2 (regression crate, shared reference systems), budget 8 min (pass nextest options after --)"
usage = 'arg "[nextest_args]..." var=#true'
run = [
  "eval cargo nextest run --profile tier2 --workspace ${usage_nextest_args:-}",
  "cargo run -q -p guardrails -- budget target/nextest/tier2/junit.xml 480 'tier 2'",
]

[tasks."test:heavy"]
description = "Tier 3 (heavy: 15 km worlds, oracle, censuses), release build, no budget; paste its output in a pull request that changes what the engines produce"
usage = 'arg "[nextest_args]..." var=#true'
run = "eval cargo nextest run --profile heavy --release --workspace --run-ignored only --no-tests pass ${usage_nextest_args:-}"

[tasks."md:lint"]
description = "Lint the Markdown written for the rewrite (globs in .markdownlint-cli2.jsonc)"
run = "markdownlint-cli2"

[tasks."docs:build"]
description = "Build the science book (docs/science) into target/book"
# mdbook-katex logs a formula KaTeX rejects and keeps the source, so the
# build succeeds (`throw-on-error` does not change that); the log is what
# tells, and the grep below fails the task on it.
run = '''
log=$(mdbook build docs/science 2>&1) && status=0 || status=$?
printf '%s\n' "$log"
[ "$status" -eq 0 ] || exit "$status"
if printf '%s' "$log" | grep -qE 'Rendering failed|Unexpected rendering failure'; then
  echo "docs:build: KaTeX rejected a formula (see the warning above)" >&2
  exit 1
fi
'''

[tasks."docs:figures"]
description = "Draw the science book's figures into docs/science/figures (pass --check to only compare)"
run = "cargo run -q -p figures --"

[tasks."docs:check"]
description = "Check the science book: every figure up to date, every page in SUMMARY.md, no math fence left, the book builds, its links resolve"
run = [
  "cargo run -q -p figures -- --check",
  '''
  fail=0
  for f in docs/science/*.md; do
    name=${f##*/}
    [ "$name" = SUMMARY.md ] && continue
    if ! grep -qF -e "($name)" -e "($name#" docs/science/SUMMARY.md; then
      echo "docs:check: $f is not listed in docs/science/SUMMARY.md" >&2
      fail=1
    fi
    if grep -q '^[[:space:]>]*```math' "$f"; then
      echo "docs:check: $f holds a math fence: write the equation between double-dollar lines" >&2
      fail=1
    fi
    # GitHub does not render a display equation whose line starts with a
    # list marker (`- ` or `+ `), nor a `$$` block indented in a list item.
    if ! awk -v f="$f" '
      /^[[:space:]>]*```/ { infence = !infence; next }
      infence { next }
      /^[[:space:]]+\$\$[[:space:]]*$/ {
        printf "docs:check: %s:%d: indented $$ (a block in a list item does not render on GitHub): write the formula on one line, $$...$$\n", f, NR > "/dev/stderr"; bad = 1; next }
      /^\$\$[[:space:]]*$/ { inmath = !inmath; next }
      inmath && /^[[:space:]]*[-+][[:space:]]/ {
        printf "docs:check: %s:%d: a math line starts with a list marker (GitHub reads a list item): end the previous line with the operator\n", f, NR > "/dev/stderr"; bad = 1 }
      END { exit bad }' "$f"; then
      fail=1
    fi
  done
  exit $fail
  ''',
  "mise run docs:build",
  "lychee --offline --include-fragments --no-progress --exclude-path target/book/404.html target/book",
]

[tasks."ci:actions"]
description = "Lint the GitHub workflows"
run = "actionlint"

# ---------------------------------------------------------------------------------------------------- #
# Front-end (web/): kept untouched during the engine phase; its checks keep running in CI.
# Not part of `ci`: `npm ci` must not run in a worktree on the shared machine.
# ---------------------------------------------------------------------------------------------------- #
[tasks."web:install"]
description = "Install the front-end dependencies (skipped when package-lock.json has not changed)"
dir = "web"
run = "npm ci"
sources = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]

[tasks."web:check"]
description = "Type-check the front-end (strict, warnings fail) and run its unit tests"
depends = ["web:install"]
dir = "web"
run = ["npm run check", "npm test"]

[tasks."web:build"]
description = "Build the front-end into web/dist/"
depends = ["web:install"]
dir = "web"
run = "npm run build"
