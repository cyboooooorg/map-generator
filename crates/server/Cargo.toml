[package]
name = "mapgen-server"
description = "Web server of the planet viewer: world library, generation jobs and static files"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8.9"
image = { version = "0.25", default-features = false, features = ["png"] }
mapgen = { workspace = true, features = ["ts"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"

# malloc_trim, see src/memory.rs
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# The tests poll job statuses.
tokio = { version = "1.54.1", features = ["time"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
