<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How a mountain range makes a rain shadow</title>
  <desc id="desc">Cross-section of a mountain range 3 kilometres high with the prevailing wind blowing from the left. An air parcel leaves the sea at 20 degrees Celsius and 60 percent relative humidity. Forced up the windward slope it cools at the dry rate, 9.8 degrees per kilometre, and becomes saturated at 1 kilometre, at 10 degrees: a cloud forms. Above it the parcel cools more slowly, about 5.4 degrees per kilometre on average, because condensation releases heat, and rain falls on the windward slope. At the 3 kilometre crest it is at minus 0.6 degrees and 40 percent of its water vapour has rained out. It then sinks down the lee slope, warming at the dry rate all the way, and reaches sea level at 28.7 degrees with 21 percent relative humidity: the lee side is warm, dry and clear.</desc>
