<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 588" width="860" height="588" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How far the rings of the four giants and of Quaoar reach, against their fluid Roche limits</title>
  <desc id="desc">Distances from each body's centre, in its equatorial radius, on one linear axis from 1 to 8 radii. Jupiter: dust rings only, the halo and main ring from 1.25 to 1.80 radii and the gossamer rings out to Amalthea at 2.54 and Thebe at 3.11, with a faint extension to 3.92; its fluid Roche limit for ice lies at 2.72 to 3.30 radii. Saturn: the dense C, B and A rings from 1.24 to 2.27 radii, inside or at the start of its fluid Roche limit at 2.15 to 2.62; Mimas at 3.08 sets the B ring's outer edge at 1.95 through its 2:1 resonance, Janus at 2.51 the A ring's at 2.27 through its 7:6; the dusty G ring and the E ring, 2.99 to 7.96 radii round Enceladus at 3.95; the Phoebe ring, off the scale, from about 80 to at least 270 radii. Uranus: narrow dense rings from 1.64 to 2.01 radii, dust rings near 2.6 and round Mab at 3.82; Roche limit 2.72 to 3.30. Neptune: narrow and faint rings from 1.69 to 2.54 radii, Galatea at 2.50; Roche limit 2.96 to 3.60. Quaoar: a ring at 4.6 and a dense ring at 7.5 of its radii, far outside its Roche limit at 3.3.</desc>
