<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The cloud decks of Jupiter, Saturn and Neptune</title>
  <desc id="desc">The base of each cloud deck, by pressure on a logarithmic scale from 0.1 to 1000 bar. Jupiter: ammonia ice at 0.72 bar, ammonium hydrosulphide near 2 bar, water ice at 5.7 bar for a solar composition (5 to 8 bar for one to three times solar). Saturn, colder, has the same decks deeper: ammonium hydrosulphide near 5 bar, water at 12.6 bar (solar) or 21 bar (five times solar). Neptune: methane ice near 1 bar, water ice near 40 bar and a water-ammonia solution cloud near 80 bar for a solar composition, 370 to 500 bar if enriched 30 to 50 times. Cloud tracking measures winds at 0.5 to 4 bar.</desc>
  <style>
    .t { fill: #e6edf3; font-size: 13px; }
    .s { fill: #9aa7b4; font-size: 11px; }
    .h { fill: #e6edf3; font-size: 15px; font-weight: 600; }
    .col { fill: #1a2433; }
    .tick { stroke: #6b7886; stroke-width: 0.8; }
  </style>
  <defs>
    <linearGradient id="nh3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f2ead8"/><stop offset="1" stop-color="#f2ead8" stop-opacity="0"/></linearGradient>
    <linearGradient id="nh4sh" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c9a27a"/><stop offset="1" stop-color="#c9a27a" stop-opacity="0"/></linearGradient>
    <linearGradient id="h2o" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9fc6e8"/><stop offset="1" stop-color="#9fc6e8" stop-opacity="0"/></linearGradient>
    <linearGradient id="ch4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#bfe9f0"/><stop offset="1" stop-color="#bfe9f0" stop-opacity="0"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6f9fc8"/><stop offset="1" stop-color="#6f9fc8" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="860" height="520" fill="#0f1622"/>

  <text class="h" x="20" y="30">Where the clouds form: the cloud decks of the giants</text>
  <text class="s" x="20" y="48">Base of each deck from equilibrium cloud models; pressure on a log scale, to scale; deeper is down. Colours illustrative.</text>

  <!-- Pressure axis: y = 90 + 82.5 (log10 p + 1). -->
  <line class="tick" x1="110" y1="90" x2="110" y2="420"/>
  <line class="tick" x1="104" y1="90" x2="110" y2="90"/>
  <line class="tick" x1="104" y1="172.5" x2="110" y2="172.5"/>
  <line class="tick" x1="104" y1="255" x2="110" y2="255"/>
  <line class="tick" x1="104" y1="337.5" x2="110" y2="337.5"/>
  <line class="tick" x1="104" y1="420" x2="110" y2="420"/>
  <text class="s" x="100" y="94" text-anchor="end">0.1 bar</text>
  <text class="s" x="100" y="176.5" text-anchor="end">1 bar</text>
  <text class="s" x="100" y="259" text-anchor="end">10 bar</text>
  <text class="s" x="100" y="341.5" text-anchor="end">100 bar</text>
  <text class="s" x="100" y="424" text-anchor="end">1000 bar</text>

  <!-- Columns. -->
  <rect class="col" x="130" y="90" width="60" height="330"/>
  <rect class="col" x="380" y="90" width="60" height="330"/>
  <rect class="col" x="620" y="90" width="60" height="330"/>
  <!-- Where cloud tracking measures the winds: 0.5 to 4 bar. -->
  <rect x="130" y="147.7" width="60" height="74.5" fill="#ffcc66" fill-opacity="0.12"/>
  <rect x="380" y="147.7" width="60" height="74.5" fill="#ffcc66" fill-opacity="0.12"/>
  <rect x="620" y="147.7" width="60" height="74.5" fill="#ffcc66" fill-opacity="0.12"/>
  <text class="t" x="160" y="76" text-anchor="middle">Jupiter</text>
  <text class="t" x="410" y="76" text-anchor="middle">Saturn</text>
  <text class="t" x="650" y="76" text-anchor="middle">Neptune (Uranus alike)</text>

  <!-- Jupiter. -->
  <rect x="130" y="142.7" width="60" height="18" fill="url(#nh3)"/>
  <rect x="130" y="160.7" width="60" height="5.6" fill="#f2ead8" fill-opacity="0.5"/>
  <line x1="130" y1="160.7" x2="190" y2="160.7" stroke="#f2ead8" stroke-width="2"/>
  <text class="t" x="198" y="158">ammonia ice</text>
  <text class="s" x="198" y="172">0.72 bar (0.84 at 3× solar)</text>
  <rect x="130" y="179.3" width="60" height="18" fill="url(#nh4sh)"/>
  <line x1="130" y1="197.3" x2="190" y2="197.3" stroke="#c9a27a" stroke-width="2"/>
  <text class="t" x="198" y="196">ammonium hydrosulphide</text>
  <text class="s" x="198" y="210">about 2 bar</text>
  <rect x="130" y="216.9" width="60" height="18" fill="url(#h2o)"/>
  <rect x="130" y="234.9" width="60" height="12.1" fill="#9fc6e8" fill-opacity="0.5"/>
  <line x1="130" y1="234.9" x2="190" y2="234.9" stroke="#9fc6e8" stroke-width="2"/>
  <text class="t" x="198" y="236">water ice</text>
  <text class="s" x="198" y="250">5.7 bar; 5 to 8 at 1–3× solar</text>

  <!-- Saturn. -->
  <text class="s" x="448" y="150">ammonia ice above</text>
  <text class="s" x="448" y="164">(not given here)</text>
  <rect x="380" y="212.2" width="60" height="18" fill="url(#nh4sh)"/>
  <line x1="380" y1="230.2" x2="440" y2="230.2" stroke="#c9a27a" stroke-width="2"/>
  <text class="t" x="448" y="222">ammonium hydrosulphide</text>
  <text class="s" x="448" y="236">about 5 bar</text>
  <rect x="380" y="245.3" width="60" height="18" fill="url(#h2o)"/>
  <rect x="380" y="263.3" width="60" height="18.3" fill="#9fc6e8" fill-opacity="0.5"/>
  <line x1="380" y1="263.3" x2="440" y2="263.3" stroke="#9fc6e8" stroke-width="2"/>
  <text class="t" x="448" y="266">water ice</text>
  <text class="s" x="448" y="280">12.6 bar (21 at 5× solar)</text>

  <!-- Neptune. -->
  <rect x="620" y="154.5" width="60" height="18" fill="url(#ch4)"/>
  <line x1="620" y1="172.5" x2="680" y2="172.5" stroke="#bfe9f0" stroke-width="2"/>
  <text class="t" x="688" y="170">methane ice</text>
  <text class="s" x="688" y="184">about 1 bar</text>
  <rect x="620" y="286.7" width="60" height="18" fill="url(#h2o)"/>
  <line x1="620" y1="304.7" x2="680" y2="304.7" stroke="#9fc6e8" stroke-width="2"/>
  <text class="t" x="688" y="300">water ice</text>
  <text class="s" x="688" y="314">about 40 bar (solar)</text>
  <rect x="620" y="311.5" width="60" height="18" fill="url(#sol)"/>
  <line x1="620" y1="329.5" x2="680" y2="329.5" stroke="#6f9fc8" stroke-width="2"/>
  <text class="t" x="688" y="334">water–ammonia</text>
  <text class="t" x="688" y="349">solution: about 80 bar</text>
  <rect x="620" y="384.4" width="60" height="10.8" fill="#6f9fc8" fill-opacity="0.6"/>
  <text class="s" x="688" y="388">solution at 30–50× solar:</text>
  <text class="s" x="688" y="402">370 to 500 bar</text>

  <!-- Legend. -->
  <rect x="130" y="440" width="22" height="12" fill="#ffcc66" fill-opacity="0.25"/>
  <text class="t" x="160" y="451">0.5 to 4 bar: the clouds whose motions give the measured winds</text>

  <text class="s" x="20" y="490">Cloud bases: Atreya &amp; Wong 2005 (equilibrium cloud condensation models; "solar" means the Sun's proportions of N, S and O).</text>
  <text class="s" x="20" y="504">Range of pressures where cloud tracking measures winds: Showman et al. 2010.</text>
</svg>
