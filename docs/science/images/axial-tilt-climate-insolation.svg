<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Sunlight over a year by latitude, for four axial tilts</title>
  <desc id="desc">Annual-mean sunlight at the top of the atmosphere, in watts per square metre, from the equator to the pole, for a planet at Earth's distance from the Sun on a circular orbit. With no tilt the equator gets 433 and the pole nothing. At Earth's tilt of 23.4 degrees the equator gets 416 and the pole 172. At 45 degrees the curve flattens: 373 at the equator, 306 at the pole. Near 54 degrees the pole and the equator get the same. At 90 degrees the pole gets 433 and the equator only 276. The global mean, 340, is the same for every tilt.</desc>
  <style>
    .t { fill: #e6edf3; font-size: 13px; }
    .s { fill: #9aa7b4; font-size: 11px; }
    .h { fill: #e6edf3; font-size: 15px; font-weight: 600; }
    .grid { stroke: #2a3544; stroke-width: 1; }
    .axis { stroke: #6b7886; stroke-width: 1; }
  </style>
  <rect width="860" height="520" fill="#0f1622"/>
