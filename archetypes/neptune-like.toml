name = "neptune-like"
description = "Neptune-like: an ice giant on a far, round orbit"

[reference]
name = "Neptune"

[locales.fr]
name = "Neptunienne"
description = "Une géante de glaces sur une orbite lointaine et ronde"
reference = "Neptune"

[inputs]
mass_earth = [15.5, 19.0]
envelope_fraction = [0.12, 0.18]
# The age of the Solar System, 4.567 Ga by the oldest solids; the
# planets formed in its first tens of Ma (Bouvier & Wadhwa 2010,
# doi:10.1038/ngeo941).
age_gyr = 4.57

[orbit]
star = "G2V"
# What Neptune receives over its own orbit: 1/q² to 1/Q² of the Earth's,
# with a = 30.07 AU and e = 0.009 (NASA Neptune fact sheet), q = 29.80
# and Q = 30.34 AU. Narrower than the other giants' ±9 %: Triton's N₂
# air is the vapour of its frost, which doubles every kelvin or so, and
# ±9 % of light moves its surface by ±0.75 K (issue #529).
insolation = [0.00109, 0.00113]
eccentricity = 0.009
axial_tilt = 28.3
