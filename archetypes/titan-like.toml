name = "titan-like"
description = "Titan-like: a large icy moon of a Saturn, under a thick cold air"

[reference]
name = "Titan"

[locales.fr]
name = "Titanienne"
description = "Une grande lune glacée d'une Saturne, sous un air épais et froid"
reference = "Titan"

# Titan: 1.3452e23 kg = 0.0225 Earth masses (NASA Saturnian satellite
# fact sheet; JPL Solar System Dynamics, planetary satellite physical
# parameters), fixed: the weight of its air hangs on it, and a ±10 %
# drawn mass spread its air over a factor of 1.5.
[inputs]
mass_earth = 0.0225
# Methane its ices carry, as a factor on the formation rule (1 % of the
# ices): the rule's own amount to twice it, not the log-normal draw that
# can leave a third of it. Titan's air needs an interior reservoir far
# larger than its surface holds: its lakes "do not contain enough methane
# to sustain the atmosphere over geologic time" against photolysis
# (Lorenz et al. 2008, doi:10.1029/2007GL032118), and episodic outgassing
# from methane clathrate in its interior resupplies it (Tobie, Lunine &
# Sotin 2006, doi:10.1038/nature04497). Calibration with Titan as its
# target: neither paper gives the inventory as a share of the ices.
ch4 = [1.0, 2.0]
# Nitrogen its ices carry, as a factor on the formation rule (0.1 % of
# the ices), instead of the log-normal draw that left single seeds
# between 0.6 and 6.3 bar. Calibration with Titan's 1.47 bar at the
# surface as its target (Huygens HASI, Fulchignoni et al. 2005,
# doi:10.1038/nature04314): its primordial nitrogen is not measured.
# What it outgasses changes with its drawn ice share, and what escape
# at the cosmic shoreline takes of it (13 to 27 %) with the drawn orbit
# of its giant: about 1.2 to 1.5 bar of N2 over the 40 seeds of
# archetype_census at 0.8. The factor centres their median on 1.47 bar.
# Over seeds 1-500 of archetype_census (#565) the surface pressure has a
# median of 1.49 bar, 5th and 95th percentiles of 1.34 and 1.62 bar, and
# ranges from 1.26 to 1.66 bar: a result over those seeds, not a bound
# for every draw.
n2 = 0.82
# Its rock's U, Th and K, Earth's abundance = 1: the Solar System's
# bodies formed from one nebula of chondritic composition (Lodders 2003,
# doi:10.1086/375492), so the scatter of the draw (0.15 dex, a spread
# across stellar systems) does not apply; within 10 % of the Earth's
# unit, a calibration for the moon's own rock.
radiogenic = [0.9, 1.1]
# The age of the Solar System (Bouvier & Wadhwa 2010,
# doi:10.1038/ngeo941).
age_gyr = 4.57

[moon]
# Grown in Saturn's disk.
host = "saturn-like"
origin = "disk"
# Semi-major axis 1 221 870 km over Saturn's equatorial radius 60 268 km:
# 20.3 radii (JPL mean orbital elements; NASA Saturn fact sheet).
semi_major_axis_radii = [18.0, 22.0]
# 0.0288 (JPL mean orbital elements).
eccentricity = [0.02, 0.03]
# Water and ices about half its mass: its 1.88 g/cm³ with its moment of
# inertia 0.34 (Iess et al. 2010, doi:10.1126/science.1182583).
ice_fraction = [0.40, 0.50]
