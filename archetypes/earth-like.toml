name = "earth-like"
description = "Earth-like: oceans, a thin air and life, in the habitable zone"

[reference]
name = "Earth"

[locales.fr]
name = "Terrestre"
description = "Des océans, un air mince et la vie, dans la zone habitable"
reference = "la Terre"

[inputs]
# One Earth mass, 5.972e24 kg: the unit itself, fixed so that the air's
# weight does not spread with a drawn mass.
mass_earth = 1.0
core_mass_fraction = 0.325
# One Earth ocean, 1.4e21 kg: the unit itself. Fixed, since the ammonia
# and the N2 scale with it, and a drawn 0.8 to 1.2 oceans left between
# 8 and 35 % of land.
water_oceans = 1.0
envelope_fraction = 0.0
life = true
co2 = 1.0
n2 = 1.0
# Ammonia its ices carry, as a factor on the formation rule (1 % of the
# ices), instead of the log-normal draw that left single seeds between
# 0.5 and 3.6 bar: its photolysis feeds the N2. Calibration with Earth's
# 1.013 bar of air as its target (US Standard Atmosphere 1976): Earth's
# primordial ammonia is not a measured quantity.
nh3 = 0.7
# The age of the Solar System, 4.567 Ga by the oldest solids; the
# planets formed in its first tens of Ma (Bouvier & Wadhwa 2010,
# doi:10.1038/ngeo941).
age_gyr = 4.57

[orbit]
star = "G2V"
# Earth's own light, 1361 W/m2 (Kopp & Lean 2011,
# doi:10.1029/2010GL045777): the unit itself.
insolation = 1.0
eccentricity = 0.017
axial_tilt = 23.44
