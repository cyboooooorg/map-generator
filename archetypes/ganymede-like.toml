name = "ganymede-like"
description = "Ganymede-like: the largest icy moon of a Jupiter, airless"

[reference]
name = "Ganymede"

[locales.fr]
name = "Ganymédienne"
description = "La plus grande lune glacée d'une Jupiter, sans air"
reference = "Ganymède"

# Ganymede: 1.4819e23 kg = 0.0248 Earth masses (NASA Jovian satellite
# fact sheet; JPL Solar System Dynamics, planetary satellite physical
# parameters), ±10 %.
[inputs]
mass_earth = [0.022, 0.027]
# Its rock's U, Th and K, Earth's abundance = 1: the Solar System's
# bodies formed from one nebula of chondritic composition (Lodders 2003,
# doi:10.1086/375492), so the scatter of the draw (0.15 dex, a spread
# across stellar systems) does not apply; within 10 % of the Earth's
# unit, a calibration for the moon's own rock.
radiogenic = [0.9, 1.1]
# The age of the Solar System, 4.567 Ga by the oldest solids; the
# planets formed in its first tens of Ma (Bouvier & Wadhwa 2010,
# doi:10.1038/ngeo941).
age_gyr = 4.57

[moon]
# Grown in Jupiter's disk.
host = "jupiter-like"
origin = "disk"
# Semi-major axis 1 070 400 km over Jupiter's equatorial radius 71 492 km:
# 15.0 radii (JPL mean orbital elements; NASA Jupiter fact sheet).
semi_major_axis_radii = [14.0, 16.0]
# 0.0013, forced by the Laplace resonance (JPL mean orbital elements).
eccentricity = [0.001, 0.002]
# Water and ices about half its mass: its 1.94 g/cm³ and moment of
# inertia 0.311 (Schubert, Anderson, Spohn & McKinnon 2004, Interior
# composition, structure and dynamics of the Galilean satellites, in
# Jupiter: the planet, satellites and magnetosphere, Cambridge UP).
ice_fraction = [0.40, 0.50]

[moon.resonance]
# Europa, in 2:1 resonance inside it (the Laplace chain, Ganymede its
# outermost moon: no partner outside it): 4.80e22 kg over Jupiter's
# 1.8982e27 kg is 2.53e-5 (JPL planetary satellite physical parameters;
# NASA Jupiter fact sheet), within ±4 %.
inner_partner_mass_ratio = [2.4e-5, 2.6e-5]
